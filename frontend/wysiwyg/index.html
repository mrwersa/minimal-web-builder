<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Minimal Web Builder preview</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
    #preview { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  </style>
</head>
<body>
  <iframe id="preview" referrerpolicy="no-referrer"></iframe>
  <script>
    (function () {
      var READY = { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 };

      function sendValue(value) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value: value,
          dataType: "json"
        }, "*");
      }

      function setFrameHeight(h) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setFrameHeight",
          height: h
        }, "*");
      }

      var renderedKey = null;
      var preview = document.getElementById("preview");

      // Render messages from Streamlit: { type: "streamlit:render", args: {...} }
      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || data.type !== "streamlit:render") return;
        var args = data.args || {};
        var html = args.html || "";
        var editing = !!args.editing;
        var height = args.height || 600;
        // Rebuild the preview iframe only when the document or edit mode changes.
        var key = editing + "\u0001" + html;
        if (key !== renderedKey) {
          preview.srcdoc = html;
          renderedKey = key;
        }
        setFrameHeight(height);
      });

      // Relay editor messages (mwb:*) coming from the sandboxed preview iframe
      // up to Streamlit as the component value.
      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || typeof data.type !== "string" || data.type.indexOf("mwb:") !== 0) return;
        if (data.isStreamlitMessage) return; // ignore our own Streamlit protocol echoes
        sendValue(data);
      });

      window.parent.postMessage(READY, "*");
    })();
  </script>
</body>
</html>
